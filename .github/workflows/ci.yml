name: CI

# Every push, on every branch, plus pull requests.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:tokens
      - run: pnpm typecheck
      - run: pnpm test
      # the roll Edge Function (P2-2): its copy of the rules engine is current, it type-checks, and its tests pass
      - run: pnpm engine:check
      - run: pnpm functions:check
      - run: pnpm test:functions
      - run: pnpm build

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Starting the stack applies every migration and the seed. Auth and storage must stay on:
      # they create the schemas the policies depend on.
      - run: pnpm exec supabase start -x studio,edge-runtime,logflare,vector,imgproxy,mailpit
      - run: pnpm db:test
      - run: pnpm db:test:mutations
