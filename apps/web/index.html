<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DM Manager</title>
  </head>
  <body>
    <!--
      Worn paper edges (P0-3). Paper surfaces draw their background on a pseudo-element with one of these
      filters, so the outline is roughened but the text on top stays sharp. "Reduce texture" turns them off.
    -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
      <filter id="paper-worn-edge" x="-4%" y="-4%" width="108%" height="108%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="paper-torn-edge" x="-6%" y="-8%" width="112%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="5" seed="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
